<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LACS - Local Area Complaint & Field Data Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">
    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        const dict = {
            en: {
                title: "Local Area Complaint & Field Data Logger",
                subtitle: "College Infrastructure & Field Management",
                signIn: "Sign In", register: "Register", email: "Email Address", password: "Password",
                forgotPass: "Forgot Password?", name: "Full Name", role: "Role", citizen: "Citizen / Student",
                staff: "Staff", admin: "Admin", dashboard: "Dashboard & Tracking", lodge: "Lodge Complaint",
                users: "User Management", cloud: "Cloud Sync Setup", announcements: "Broadcasts",
                audit: "Audit Logs", profile: "Profile & Settings", logout: "Logout",
                totalComplaints: "Total Complaints", pending: "Pending", resolved: "Resolved",
                export: "Export CSV", searchPlaceholder: "Search by ID, Title or Location...",
                allStatuses: "All Statuses", category: "Category", action: "Action",
                submitComplaint: "Lodge New Complaint / Field Data Logger", complaintTitle: "Complaint Title",
                description: "Description", location: "Location / Landmark", gps: "GPS Detect",
                photo: "Upload Photo (Camera or Gallery)", anonymous: "Submit Anonymously",
                submitBtn: "Submit Complaint", changePass: "Change Password", oldPass: "Old Password",
                newPass: "New Password", updatePass: "Update Password", broadcastNotice: "Post Broadcast Announcement"
            },
            hi: {
                title: "स्थानीय क्षेत्र शिकायत और फील्ड डेटा लॉगर",
                subtitle: "कॉलेज इन्फ्रास्ट्रक्चर और फील्ड प्रबंधन",
                signIn: "साइन इन", register: "रजिस्टर", email: "ईमेल पता", password: "पासवर्ड",
                forgotPass: "पासवर्ड भूल गए?", name: "पूरा नाम", role: "रोल", citizen: "नागरिक / छात्र",
                staff: "स्टाफ", admin: "एडमिन", dashboard: "डैशबोर्ड और ट्रैकिंग", lodge: "शिकायत दर्ज करें",
                users: "यूजर मैनेजमेंट", cloud: "क्लाउड सिंक सेटअप", announcements: "घोषणाएं",
                audit: "ऑडिट लॉग", profile: "प्रोफाइल और सेटिंग्स", logout: "लॉग आउट",
                totalComplaints: "कुल शिकायतें", pending: "लंबित (Pending)", resolved: "हल की गई (Resolved)",
                export: "CSV एक्सपोर्ट", searchPlaceholder: "आईडी, शीर्षक या लोकेशन से खोजें...",
                allStatuses: "सभी स्टेटस", category: "श्रेणी", action: "एक्शन",
                submitComplaint: "नई शिकायत दर्ज करें", complaintTitle: "शिकायत का शीर्षक",
                description: "विवरण", location: "लोकेशन / लैंडमार्क", gps: "जीपीएस डिटेक्ट",
                photo: "फोटो अपलोड करें (कैमरा या गैलरी)", anonymous: "गुमनाम (Anonymous) रूप से सबमिट करें",
                submitBtn: "शिकायत सबमिट करें", changePass: "पासवर्ड बदलें", oldPass: "पुराना पासवर्ड",
                newPass: "नया पासवर्ड", updatePass: "पासवर्ड अपडेट करें", broadcastNotice: "घोषणा प्रसारित करें"
            },
            mr: {
                title: "स्थानिक क्षेत्र तक्रार आणि फील्ड डेटा लॉगर",
                subtitle: "कॉलेज पायाभूत सुविधा आणि फील्ड व्यवस्थापन",
                signIn: "साइन इन", register: "नोंदणी", email: "ईमेल पत्ता", password: "पासवर्ड",
                forgotPass: "पासवर्ड विसरलात?", name: "पूर्ण नाव", role: "भूमिका", citizen: "नागरिक / विद्यार्थी",
                staff: "स्टाफ", admin: "प्रशासन", dashboard: "डॅशबोर्ड आणि ट्रॅकिंग", lodge: "तक्रार नोंदवा",
                users: "वापरकर्ता व्यवस्थापन", cloud: "क्लाउड सिंक सेटअप", announcements: "घोषणा",
                audit: "ऑडिट लॉग", profile: "प्रोफाइल आणि सेटिंग्ज", logout: "बाहेर पडा",
                totalComplaints: "एकूण तक्रारी", pending: "प्रलंबित", resolved: "निवारण झाले",
                export: "CSV एक्सपोर्ट", searchPlaceholder: "आयडी, शीर्षक किंवा ठिकाणावरून शोधा...",
                allStatuses: "सर्व स्थिती", category: "श्रेणी", action: "कृती",
                submitComplaint: "तक्रार नोंदवा", complaintTitle: "तक्रारीचे शीर्षक",
                description: "वर्णन", location: "ठिकाण / खुण", gps: "जीपीएस शोधा",
                photo: "फोटो अपलोड करा (कॅमेरा किंवा गॅलरी)", anonymous: "अनामिकपणे सबमिट करा",
                submitBtn: "तक्रार सबमिट करा", changePass: "पासवर्ड बदला", oldPass: "जुना पासवर्ड",
                newPass: "नवीन पासवर्ड", updatePass: "पासवर्ड अपडेट करा", broadcastNotice: "घोषणा प्रसारित करा"
            }
        };

        let appState = {
            lang: localStorage.getItem('lacs_lang') || 'en',
            theme: localStorage.getItem('lacs_theme') || 'dark',
            currentUser: JSON.parse(localStorage.getItem('lacs_current_user') || 'null'),
            authMode: 'login',
            activeTab: 'dashboard',
            complaints: JSON.parse(localStorage.getItem('lacs_complaints') || JSON.stringify([
                { id: 'LACS-00001', title: 'Water pipe burst near main canteen', category: 'Plumbing', description: 'Continuous water leakage.', location: 'Main Campus Canteen', status: 'Pending', user: 'student@college.edu', date: '2026-10-01' }
            ])),
            users: JSON.parse(localStorage.getItem('lacs_users') || '[]'),
            auditLogs: JSON.parse(localStorage.getItem('lacs_audit') || JSON.stringify([
                { id: 1, action: 'System Initialized', user: 'System', timestamp: '2026-10-01 10:00:00' }
            ])),
            searchQuery: '',
            filterStatus: 'All'
        };

        function persist() {
            localStorage.setItem('lacs_complaints', JSON.stringify(appState.complaints));
            localStorage.setItem('lacs_users', JSON.stringify(appState.users));
            localStorage.setItem('lacs_audit', JSON.stringify(appState.auditLogs));
            localStorage.setItem('lacs_current_user', JSON.stringify(appState.currentUser));
            localStorage.setItem('lacs_lang', appState.lang);
            localStorage.setItem('lacs_theme', appState.theme);
        }

        function recordLog(act) {
            appState.auditLogs.unshift({
                id: Date.now(),
                action: act,
                user: appState.currentUser ? appState.currentUser.email : 'Guest',
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19)
            });
            persist();
        }

        function renderApp() {
            try {
                document.documentElement.classList.toggle('dark', appState.theme === 'dark');
                const tr = dict[appState.lang];
                const root = document.getElementById('app');
                if (!root) return;

                if (!appState.currentUser) {
                    root.innerHTML = `
                        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center shadow-sm">
                            <h1 class="text-xl font-bold text-blue-600 dark:text-blue-400">LACS</h1>
                            <div class="flex items-center gap-3">
                                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                                    ${appState.theme === 'dark' ? '☀️' : '🌙'}
                                </button>
                                <select onchange="changeLanguage(this.value)" class="bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 px-3 py-1 rounded text-sm cursor-pointer focus:outline-none">
                                    <option value="en" ${appState.lang==='en'?'selected':''}>English</option>
                                    <option value="hi" ${appState.lang==='hi'?'selected':''}>हिंदी</option>
                                    <option value="mr" ${appState.lang==='mr'?'selected':''}>मराठी</option>
                                </select>
                            </div>
                        </header>
                        <main class="flex-1 flex items-center justify-center p-6">
                            <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-8 rounded-2xl shadow-xl w-full max-w-md">
                                <div class="flex mb-6 border-b border-slate-200 dark:border-slate-700 pb-2">
                                    <button onclick="switchAuth('login')" class="flex-1 pb-2 font-semibold text-center ${appState.authMode==='login'?'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600':'text-slate-400'}">${tr.signIn}</button>
                                    <button onclick="switchAuth('register')" class="flex-1 pb-2 font-semibold text-center ${appState.authMode==='register'?'text-blue-600 dark:text-blue-400 border-b-2 border-blue-600':'text-slate-400'}">${tr.register}</button>
                                </div>
                                ${appState.authMode === 'login' ? `
                                    <form onsubmit="processLogin(event)" class="space-y-4">
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.email}</label>
                                            <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="student@college.edu">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.password}</label>
                                            <input type="password" id="loginPass" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                                        </div>
                                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">${tr.signIn}</button>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 text-center mt-3">Super Admins: anuragkishan49@gmail.com / aayushbane2006@gmail.com (Pass: Jsr2026)</p>
                                    </form>
                                ` : `
                                    <form onsubmit="processRegister(event)" class="space-y-4">
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.name}</label>
                                            <input type="text" id="regName" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.email}</label>
                                            <input type="email" id="regEmail" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.password}</label>
                                            <input type="password" id="regPass" required class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.role}</label>
                                            <select id="regRole" class="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                                <option value="Citizen">${tr.citizen}</option>
                                                <option value="Staff">${tr.staff}</option>
                                                <option value="Admin">${tr.admin}</option>
                                            </select>
                                        </div>
                                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">${tr.register}</button>
                                    </form>
                                `}
                            </div>
                        </main>
                    `;
                } else {
                    const uRole = appState.currentUser.role;
                    const isAdminOrSuper = uRole === 'Admin' || uRole === 'SuperAdmin';
                    const isSuperAdmin = uRole === 'SuperAdmin';
                    const visibleComplaints = uRole === 'Citizen' ? appState.complaints.filter(c => c.user === appState.currentUser.email) : appState.complaints;

                    root.innerHTML = `
                        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
                            <div class="flex items-center gap-3">
                                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-lg">LACS</div>
                                <div>
                                    <h1 class="text-lg font-bold">${tr.title}</h1>
                                    <p class="text-xs text-slate-500 dark:text-slate-400">${appState.currentUser.name} (${uRole})</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition" title="Toggle Theme">
                                    ${appState.theme === 'dark' ? '☀️' : '🌙'}
                                </button>
                                <select onchange="changeLanguage(this.value)" class="bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 px-3 py-1 rounded text-sm cursor-pointer focus:outline-none">
                                    <option value="en" ${appState.lang==='en'?'selected':''}>English</option>
                                    <option value="hi" ${appState.lang==='hi'?'selected':''}>हिंदी</option>
                                    <option value="mr" ${appState.lang==='mr'?'selected':''}>मराठी</option>
                                </select>
                                <button onclick="processLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm transition">${tr.logout}</button>
                            </div>
                        </header>

                        <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                            <div class="flex gap-2 border-b border-slate-200 dark:border-slate-700 pb-3 overflow-x-auto">
                                <button onclick="switchTab('dashboard')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='dashboard'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">📊 ${tr.dashboard}</button>
                                <button onclick="switchTab('file')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='file'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">➕ ${tr.lodge}</button>
                                ${isAdminOrSuper ? `<button onclick="switchTab('users')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='users'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">👥 ${tr.users}</button>` : ''}
                                ${isAdminOrSuper ? `<button onclick="switchTab('cloud')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='cloud'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">☁️ ${tr.cloud}</button>` : ''}
                                ${isAdminOrSuper ? `<button onclick="switchTab('announcements')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='announcements'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">📢 ${tr.announcements}</button>` : ''}
                                ${isAdminOrSuper ? `<button onclick="switchTab('audit')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='audit'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">📋 ${tr.audit}</button>` : ''}
                                <button onclick="switchTab('profile')" class="px-4 py-2 rounded-lg font-medium text-sm whitespace-nowrap ${appState.activeTab==='profile'?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'}">⚙️ ${tr.profile}</button>
                            </div>

                            ${appState.activeTab === 'dashboard' ? `
                                <div class="space-y-6">
                                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <h4 class="text-xs text-slate-500 dark:text-slate-400 uppercase font-semibold">${tr.totalComplaints}</h4>
                                            <p class="text-3xl font-bold mt-1 text-blue-600 dark:text-blue-400">${visibleComplaints.length}</p>
                                        </div>
                                        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <h4 class="text-xs text-slate-500 dark:text-slate-400 uppercase font-semibold">${tr.pending}</h4>
                                            <p class="text-3xl font-bold mt-1 text-amber-500">${visibleComplaints.filter(c=>c.status!=='Resolved').length}</p>
                                        </div>
                                        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                            <h4 class="text-xs text-slate-500 dark:text-slate-400 uppercase font-semibold">${tr.resolved}</h4>
                                            <p class="text-3xl font-bold mt-1 text-emerald-500">${visibleComplaints.filter(c=>c.status==='Resolved').length}</p>
                                        </div>
                                        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                                            <div>
                                                <h4 class="text-xs text-slate-500 dark:text-slate-400 uppercase font-semibold">Export</h4>
                                                <p class="text-xs text-slate-400">Download report</p>
                                            </div>
                                            ${isAdminOrSuper ? `<button onclick="exportReportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-semibold shadow">📥 ${tr.export}</button>` : ''}
                                        </div>
                                    </div>

                                    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-wrap gap-4 items-center">
                                        <input type="text" oninput="onSearchInput(this.value)" value="${appState.searchQuery}" placeholder="${tr.searchPlaceholder}" class="px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm flex-1 min-w-[240px]">
                                        <select onchange="onStatusFilter(this.value)" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                                            <option value="All" ${appState.filterStatus==='All'?'selected':''}>${tr.allStatuses}</option>
                                            <option value="Pending" ${appState.filterStatus==='Pending'?'selected':''}>Pending</option>
                                            <option value="In Progress" ${appState.filterStatus==='In Progress'?'selected':''}>In Progress</option>
                                            <option value="Resolved" ${appState.filterStatus==='Resolved'?'selected':''}>Resolved</option>
                                        </select>
                                    </div>

                                    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                                        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 font-bold text-blue-600 dark:text-blue-300">${uRole === 'Citizen' ? 'मेरी दर्ज शिकायतें और ट्रैकिंग (My Complaints & Tracking)' : 'Complaint Tracking Records'}</div>
                                        <div class="divide-y divide-slate-200 dark:divide-slate-700">
                                            ${visibleComplaints.filter(c => {
                                                const matchSearch = c.title.toLowerCase().includes(appState.searchQuery.toLowerCase()) || c.id.toLowerCase().includes(appState.searchQuery.toLowerCase()) || c.location.toLowerCase().includes(appState.searchQuery.toLowerCase());
                                                const matchStatus = appState.filterStatus === 'All' || c.status === appState.filterStatus;
                                                return matchSearch && matchStatus;
                                            }).map(c => `
                                                <div class="p-4 flex justify-between items-center hover:bg-slate-50 dark:hover:bg-slate-700/20">
                                                    <div>
                                                        <span class="font-mono text-xs text-blue-600 dark:text-blue-400 font-bold">${c.id}</span>
                                                        <h4 class="font-semibold mt-1">${c.title}</h4>
                                                        <p class="text-xs text-slate-500 dark:text-slate-400">Category: ${c.category} | Location: ${c.location} | By: ${c.user}</p>
                                                        ${c.photo ? `<a href="${c.photo}" target="_blank" class="text-xs text-blue-500 hover:underline mt-1 block">🖼️ View Photo</a>` : ''}
                                                    </div>
                                                    <div class="flex items-center gap-3">
                                                        ${isAdminOrSuper ? `
                                                            <select onchange="changeComplaintStatus('${c.id}', this.value)" class="px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                                                <option value="Pending" ${c.status==='Pending'?'selected':''}>Pending</option>
                                                                <option value="In Progress" ${c.status==='In Progress'?'selected':''}>In Progress</option>
                                                                <option value="Resolved" ${c.status==='Resolved'?'selected':''}>Resolved</option>
                                                            </select>
                                                            <button onclick="removeComplaint('${c.id}')" class="text-xs text-red-500 hover:underline">Delete</button>
                                                        ` : `
                                                            <span class="bg-amber-500/20 text-amber-500 px-3 py-1 rounded-full text-xs font-semibold">${c.status}</span>
                                                        `}
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            ` : appState.activeTab === 'file' ? `
                                <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl max-w-xl mx-auto">
                                    <h3 class="text-xl font-bold mb-6 text-blue-600 dark:text-blue-300">${tr.submitComplaint}</h3>
                                    <form onsubmit="handleComplaintSubmit(event)" class="space-y-4">
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.category}</label>
                                            <select id="cCat" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                                <option value="Plumbing">Plumbing</option>
                                                <option value="IT/Electronics">IT/Electronics</option>
                                                <option value="Electrical">Electrical</option>
                                                <option value="Cleaning">Cleaning</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.complaintTitle}</label>
                                            <input type="text" id="cTitle" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" placeholder="Issue summary">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.description}</label>
                                            <textarea id="cDesc" required rows="3" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" placeholder="Details..."></textarea>
                                        </div>
                                        <div class="flex gap-2">
                                            <input type="text" id="cLoc" required class="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm" placeholder="${tr.location}">
                                            <button type="button" onclick="fetchGPS()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap">📍 ${tr.gps}</button>
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.photo}</label>
                                            <input type="file" accept="image/*" id="cPhoto" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                                        </div>
                                        <div class="flex items-center gap-2 pt-2">
                                            <input type="checkbox" id="cAno" class="w-4 h-4 rounded text-blue-600">
                                            <label for="cAno" class="text-sm font-medium">${tr.anonymous}</label>
                                        </div>
                                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">${tr.submitBtn}</button>
                                    </form>
                                </div>
                            ` : appState.activeTab === 'users' && isAdminOrSuper ? `
                                <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6 space-y-4 shadow-sm">
                                    <h3 class="text-lg font-bold text-blue-600 dark:text-blue-300">User & Role Management</h3>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-sm">
                                            <thead>
                                                <tr class="bg-slate-100 dark:bg-slate-700/50 text-slate-500 uppercase text-xs">
                                                    <th class="p-3">Name</th>
                                                    <th class="p-3">Email</th>
                                                    <th class="p-3">Role</th>
                                                    <th class="p-3">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                                <tr>
                                                    <td class="p-3 font-semibold">Anurag Kishan</td>
                                                    <td class="p-3">anuragkishan49@gmail.com</td>
                                                    <td class="p-3"><span class="bg-purple-500/20 text-purple-500 px-2.5 py-1 rounded-full text-xs font-semibold">SuperAdmin</span></td>
                                                    <td class="p-3 text-slate-400 text-xs">Permanent</td>
                                                </tr>
                                                <tr>
                                                    <td class="p-3 font-semibold">Aayush Bane</td>
                                                    <td class="p-3">aayushbane2006@gmail.com</td>
                                                    <td class="p-3"><span class="bg-purple-500/20 text-purple-500 px-2.5 py-1 rounded-full text-xs font-semibold">SuperAdmin</span></td>
                                                    <td class="p-3 text-slate-400 text-xs">Permanent</td>
                                                </tr>
                                                ${appState.users.map((u, idx) => `
                                                    <tr>
                                                        <td class="p-3 font-semibold">${u.name}</td>
                                                        <td class="p-3">${u.email}</td>
                                                        <td class="p-3"><span class="bg-blue-500/20 text-blue-500 px-2.5 py-1 rounded-full text-xs font-semibold">${u.role}</span></td>
                                                        <td class="p-3 space-x-2">
                                                            <button onclick="updateUserRole(${idx}, 'Admin')" class="bg-blue-600 text-white px-2.5 py-1 rounded text-xs">Make Admin</button>
                                                            <button onclick="updateUserRole(${idx}, 'Staff')" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs">Make Staff</button>
                                                            <button onclick="updateUserRole(${idx}, 'Citizen')" class="bg-slate-600 text-white px-2.5 py-1 rounded text-xs">Demote</button>
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ` : appState.activeTab === 'cloud' && isAdminOrSuper ? `
                                <div class="max-w-xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-4">
                                    <h3 class="text-xl font-bold text-blue-600 dark:text-blue-300">Cloud Sync Setup (Supabase)</h3>
                                    <form onsubmit="handleCloudConnect(event)" class="space-y-4">
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">Supabase Project URL</label>
                                            <input type="text" id="sbUrl" value="${localStorage.getItem('lacs_sb_url')||''}" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm font-mono" placeholder="https://xyz.supabase.co">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">Supabase Anon Key</label>
                                            <input type="password" id="sbKey" value="${localStorage.getItem('lacs_sb_key')||''}" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm font-mono" placeholder="eyJhbGciOi...">
                                        </div>
                                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow">Connect Cloud</button>
                                    </form>
                                </div>
                            ` : appState.activeTab === 'announcements' && isAdminOrSuper ? `
                                <div class="max-w-xl mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-4">
                                    <h3 class="text-xl font-bold text-blue-600 dark:text-blue-300">${tr.broadcastNotice}</h3>
                                    <form onsubmit="handleBroadcast(event)" class="space-y-4">
                                        <input type="text" id="annTitle" required placeholder="Title" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                        <textarea id="annMsg" required rows="3" placeholder="Message" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"></textarea>
                                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow">Broadcast</button>
                                    </form>
                                </div>
                            ` : appState.activeTab === 'audit' && isAdminOrSuper ? `
                                <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6 space-y-4 shadow-sm">
                                    <h3 class="text-lg font-bold text-blue-600 dark:text-blue-300">System Audit Logs</h3>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-sm">
                                            <thead>
                                                <tr class="bg-slate-100 dark:bg-slate-700/50 text-slate-500 uppercase text-xs">
                                                    <th class="p-3">Timestamp</th>
                                                    <th class="p-3">User</th>
                                                    <th class="p-3">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-200 dark:divide-slate-700 font-mono text-xs">
                                                ${appState.auditLogs.map(l => `
                                                    <tr>
                                                        <td class="p-3 text-slate-500 dark:text-slate-400">${l.timestamp}</td>
                                                        <td class="p-3 font-semibold">${l.user}</td>
                                                        <td class="p-3 text-slate-600 dark:text-slate-300">${l.action}</td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ` : `
                                <div class="max-w-md mx-auto bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-6">
                                    <h3 class="text-xl font-bold text-blue-600 dark:text-blue-300">Profile & Settings</h3>
                                    <div class="space-y-2 text-sm">
                                        <p><strong>Name:</strong> ${appState.currentUser.name}</p>
                                        <p><strong>Email:</strong> ${appState.currentUser.email}</p>
                                        <p><strong>Role:</strong> ${uRole}</p>
                                    </div>
                                    <form onsubmit="handlePasswordChange(event)" class="space-y-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                                        <h4 class="font-semibold text-sm">${tr.changePass}</h4>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.oldPass}</label>
                                            <input type="password" id="oldP" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                                        </div>
                                        <div>
                                            <label class="block text-sm mb-1 font-medium">${tr.newPass}</label>
                                            <input type="password" id="newP" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
                                        </div>
                                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow">${tr.updatePass}</button>
                                    </form>
                                </div>
                            `}
                        </main>
                    `;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('app').innerHTML = `<div class="p-8 text-center text-red-500">Error rendering app: ${err.message}</div>`;
            }
        }

        function changeLanguage(lang) { appState.lang = lang; persist(); renderApp(); }
        function toggleTheme() {
            appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
            persist(); renderApp();
        }
        function switchAuth(mode) { appState.authMode = mode; renderApp(); }
        function switchTab(tab) { appState.activeTab = tab; renderApp(); }
        function processLogout() { appState.currentUser = null; persist(); renderApp(); }
        function onSearchInput(q) { appState.searchQuery = q; }
        function onStatusFilter(s) { appState.filterStatus = s; renderApp(); }

        function processLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            if ((email === 'anuragkishan49@gmail.com' || email === 'aayushbane2006@gmail.com') && pass === 'Jsr2026') {
                appState.currentUser = { email, name: email.includes('anurag') ? 'Anurag Kishan' : 'Aayush Bane', role: 'SuperAdmin' };
                recordLog(`Super Admin logged in: ${email}`);
                persist(); renderApp();
                return;
            }
            const found = appState.users.find(u => u.email === email && u.pass === pass);
            if (found) {
                appState.currentUser = found;
                recordLog(`User logged in: ${email}`);
                persist(); renderApp();
            } else {
                alert('Invalid email or password!');
            }
        }

        function processRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            if (appState.users.find(u => u.email === email)) {
                alert('Email already registered!');
                return;
            }
            appState.users.push({ name, email, pass, role });
            recordLog(`Registered user: ${email}`);
            persist();
            alert('Registration successful! Please sign in.');
            appState.authMode = 'login';
            renderApp();
        }

        function fetchGPS() {
            if (!navigator.geolocation) { alert('GPS not supported'); return; }
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('cLoc').value = `Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`;
            }, () => alert('Unable to retrieve GPS'));
        }

        function handleComplaintSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('cTitle').value;
            const category = document.getElementById('cCat').value;
            const description = document.getElementById('cDesc').value;
            const location = document.getElementById('cLoc').value;
            const isAno = document.getElementById('cAno').checked;
            const id = `LACS-${String(appState.complaints.length + 1).padStart(5, '0')}`;
            
            const fileInput = document.getElementById('cPhoto');
            const saveRecord = (photo) => {
                appState.complaints.unshift({
                    id, title, category, description, location,
                    status: 'Pending', user: isAno ? 'Anonymous' : appState.currentUser.email,
                    date: new Date().toISOString().split('T')[0], photo
                });
                recordLog(`Submitted complaint ${id}`);
                persist();
                alert(`Complaint registered with ID: ${id}`);
                appState.activeTab = 'dashboard';
                renderApp();
            };

            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onloadend = () => saveRecord(reader.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveRecord(null);
            }
        }

        function changeComplaintStatus(id, st) {
            appState.complaints = appState.complaints.map(c => c.id === id ? { ...c, status: st } : c);
            recordLog(`Updated complaint ${id} status to ${st}`);
            persist(); renderApp();
        }

        function removeComplaint(id) {
            if (confirm(`Delete complaint ${id}?`)) {
                appState.complaints = appState.complaints.filter(c => c.id !== id);
                recordLog(`Deleted complaint ${id}`);
                persist(); renderApp();
            }
        }

        function updateUserRole(idx, newRole) {
            appState.users[idx].role = newRole;
            recordLog(`Changed user ${appState.users[idx].email} role to ${newRole}`);
            persist(); renderApp();
            alert('Role updated successfully!');
        }

        function handleCloudConnect(e) {
            e.preventDefault();
            const url = document.getElementById('sbUrl').value;
            const key = document.getElementById('sbKey').value;
            localStorage.setItem('lacs_sb_url', url);
            localStorage.setItem('lacs_sb_key', key);
            recordLog('Connected Cloud Backend');
            alert('Cloud backend configured successfully!');
        }

        function handleBroadcast(e) {
            e.preventDefault();
            const title = document.getElementById('annTitle').value;
            recordLog(`Broadcasted announcement: ${title}`);
            alert('Announcement broadcasted!');
            document.getElementById('annTitle').value = '';
            document.getElementById('annMsg').value = '';
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const oldP = document.getElementById('oldP').value;
            const newP = document.getElementById('newP').value;
            if (appState.currentUser.role === 'SuperAdmin') {
                recordLog('Super Admin password action');
                persist(); alert('Password updated successfully!');
            } else {
                const u = appState.users.find(usr => usr.email === appState.currentUser.email);
                if (u && u.pass === oldP) {
                    u.pass = newP;
                recordLog('User changed password');
                    persist(); alert('Password updated successfully!');
                } else {
                    alert('Incorrect old password!');
                }
            }
        }

        function exportReportCSV() {
            const headers = ['ID', 'Title', 'Category', 'Status', 'User', 'Date', 'Location'];
            const rows = appState.complaints.map(c => [c.id, `"${c.title}"`, c.category, c.status, c.user, c.date, `"${c.location}"`]);
            const csv = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const link = document.createElement('a');
            link.setAttribute('href', encodeURI(csv));
            link.setAttribute('download', 'lacs_report.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            recordLog('Exported CSV report');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
